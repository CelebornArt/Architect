<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f6f3" />
  <title>Architect — Workspace</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="editor-enhancements.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="workspace"><div class="workspace-mark">A</div><div class="workspace-name">Acme Studio <span>⌄</span></div><button class="icon-button" aria-label="Workspace menu">•••</button></div>
      <div class="quick-actions"><button data-action="search"><span>⌕</span> Search <kbd>⌘ K</kbd></button><button data-action="updates"><span>◷</span> Updates</button><button data-action="settings"><span>⚙</span> Settings & members</button></div>
      <nav id="page-list" aria-label="Workspace outline"></nav>
      <button class="add-page" data-action="new-page"><span>＋</span> New page</button>
      <div class="sidebar-bottom"><div class="nav-label">TOOLS</div><button class="nav-item" data-action="templates"><span>▦</span> Templates</button><button class="nav-item" data-action="import"><span>⇧</span> Import</button><button class="nav-item" data-action="trash"><span>▤</span> Trash</button><div class="help-card"><span class="help-icon">✦</span><div><b>Need a hand?</b><small>Visit the help center</small></div><span>↗</span></div><div class="nav-label workspaces-label">WORKSPACES</div><div id="workspace-access"></div><div class="profile"><div class="avatar">JD</div><div><b>Jordan Davis</b><small>Free plan</small></div><button class="icon-button">•••</button></div></div>
    </aside>
    <main class="main-area"><header class="topbar"><button class="mobile-menu" data-action="toggle-sidebar">☰</button><div class="breadcrumbs" id="breadcrumbs"></div><div class="top-actions"><span class="saved-status" id="saved-status">All changes saved</span><button class="icon-button" aria-label="Share">↗</button><button class="icon-button" aria-label="Comments">▤</button><button class="icon-button" aria-label="More options">•••</button><button class="share-button" data-action="share">Share</button></div></header><section class="editor-wrap"><div class="editor" id="editor"></div></section></main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="search-dialog"><div class="search-box"><span>⌕</span><input id="search-input" placeholder="Search pages..." autocomplete="off"/><kbd>ESC</kbd></div><div class="search-results" id="search-results"></div></dialog>
  <div id="command-menu" class="command-menu" hidden></div>
  <dialog id="asset-dialog"><div class="asset-header"><strong id="asset-title">Choose cover</strong><button class="icon-button" data-close-asset>×</button></div><div class="asset-preview" id="asset-preview"></div><div class="asset-options" id="asset-options"></div><div class="asset-actions"><label class="upload-button">Upload image<input id="asset-upload" type="file" accept="image/*" hidden></label><button class="share-button" data-apply-asset>Apply</button></div></dialog>
  <script src="dist/workspace.js"></script>
</body>
</html>
